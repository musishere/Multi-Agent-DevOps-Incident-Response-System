[package]
name = "incident_response_system"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "migrate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
